<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="100" height="100" rx="24" fill="url(#robotGrad)" />
  
  <!-- Robot Antenna -->
  <circle cx="50" cy="22" r="4" fill="#ffffff" />
  <rect x="48" y="24" width="4" height="8" rx="2" fill="#ffffff" />
  
  <!-- Robot Head -->
  <rect x="25" y="32" width="50" height="42" rx="12" fill="#ffffff" />
  
  <!-- Ears -->
  <rect x="19" y="44" width="6" height="16" rx="3" fill="#ffffff" opacity="0.8" />
  <rect x="75" y="44" width="6" height="16" rx="3" fill="#ffffff" opacity="0.8" />
  
  <!-- Screen/Visor -->
  <rect x="31" y="38" width="38" height="20" rx="6" fill="#0f172a" />
  
  <!-- Eyes Glowing -->
  <circle cx="41" cy="48" r="4" fill="#38bdf8" />
  <circle cx="59" cy="48" r="4" fill="#38bdf8" />
  <circle cx="42" cy="47" r="1" fill="#ffffff" />
  <circle cx="60" cy="47" r="1" fill="#ffffff" />
  
  <!-- Smile -->
  <path d="M43 64 Q50 69 57 64" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
